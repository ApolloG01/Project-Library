<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorri's Library</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Sorri's Library</h1>
    </header>
    <!-- A modal dialog containing a form -->
    <dialog>
      <h2 style="margin-bottom: 20px">Add a New Book</h2>
      <form method="dialog" novalidate>
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" required />
          <div class="error" id="title-error"></div>
        </div>

        <div class="form-group">
          <label for="author">Author *</label>
          <input type="text" id="author" name="author" required />
          <div class="error" id="author-error"></div>
        </div>

        <div class="form-group">
          <label for="pages">Pages *</label>
          <input type="number" id="pages" name="pages" min="1" required />
          <div class="error" id="pages-error"></div>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="read" name="read" />
          <label for="read">Have you read this book?</label>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <div class="buttons">
          <button type="button" value="cancel">Cancel</button>
          <button type="submit" value="confirm">Add Book</button>
        </div>
      </form>
    </dialog>

    <output></output>
    <div class="wrapper">
      <div class="container"></div>
      <footer class="footer"></footer>
      <script src="script.js"></script>
    </div>
  </body>
</html>
